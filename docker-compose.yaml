services:
  api:
    build:
      context: .
    container_name: writewinged_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8082}:${PORT:-8000}"

  db:
    image: postgres:16
    container_name: writewinged_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
